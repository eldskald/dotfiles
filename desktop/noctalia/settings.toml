config_version = 12

[bar.default]
background_opacity = 0.89999997988343239
concave_edge_corners = false
end = [ "media", "tray", "network", "bluetooth", "volume", "battery", "control-center" ]
margin_edge = 8
margin_ends = 8
radius = 10
scale = 1.1000000089406967
start = [ "workspaces", "active_window" ]
thickness = 44
widget_spacing = 12

[location]
address = "São Paulo, Brazil"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/rafael/.face.icon"
font_family = "Ubuntu Nerd Font"

[theme]
builtin = "Tokyo-Night"

[osd.kinds]
media = false

[wallpaper]
directory = "/home/rafael/wallpapers"
per_monitor_directories = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 900

    [wallpaper.default]
    path = "/home/rafael/wallpapers/dark-souls-1.jpg"

    [wallpaper.last]
    path = "/home/rafael/wallpapers/dark-souls-1.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/rafael/wallpapers/dark-souls-1.jpg"
    directory = "/home/rafael/wallpapers"

    [wallpaper.monitors.DP-2]
    path = "/home/rafael/wallpapers/dark-souls-1.jpg"
    directory = "/home/rafael/wallpapers"

[widget.clock]
format = "{:%H:%M   %A, %B %d}"

[widget.media]
art_size = 20
max_length = 500
title_scroll = "on_hover"
artist_first = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.workspaces]
show_labels = false
